<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taylor</title>
<!--
  Splash do Taylor: HTML + CSS + SVG puro (sem bibliotecas, sem rede, sem acesso ao backend).
  Roda só no processo de renderização do Electron. O main.js continua igual:
    - abre com ?modo=abertura (toca uma vez, sem frase)
    - chama setModo('carregamento') se o sistema demorar (repete, com frase)
-->
<style>
:root{
  --bg:#061631; --bg2:#071a3d; --text:#f4f7ff; --muted:#9cb0d2;
  --primary:#236bff; --primary2:#3f35f5; --cyan:#4db5ff; --ok:#36db9b;
  --border:rgba(124,164,233,.22); --track:#12366d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  overflow:hidden; color:var(--text);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 14% 8%, rgba(23,105,232,.55) 0, transparent 38%),
    radial-gradient(circle at 92% 96%, rgba(63,53,245,.35) 0, transparent 42%),
    linear-gradient(125deg,var(--bg2),var(--bg));
  display:flex; align-items:center; justify-content:center;
}
/* ondas de fundo, como na tela de login */
body::before,body::after{
  content:""; position:absolute; width:120vw; height:120vw; pointer-events:none;
  border:1px solid rgba(56,96,255,.28); border-radius:42% 58% 63% 37%; transform:rotate(28deg);
}
body::before{right:-80vw; top:-85vw}
body::after{left:-85vw; bottom:-90vw}

.stage{position:relative;z-index:1;width:min(94vw,600px);display:flex;flex-direction:column;align-items:center;gap:14px}

/* ---------- logo ---------- */
.logo{width:128px;height:128px;overflow:visible;filter:drop-shadow(0 0 26px rgba(54,84,255,.42))}
.tile{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.55)}
.go .tile{animation:pop .6s cubic-bezier(.2,.9,.3,1.15) forwards}
@keyframes pop{to{opacity:1;transform:none}}

.c{opacity:0;transform-box:fill-box;transform-origin:center;
   transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.5)}
.go .c{
  animation:snap .75s cubic-bezier(.2,.9,.3,1.12) forwards, glow 1.4s ease-in-out infinite;
  animation-delay:calc(350ms + var(--i)*95ms), calc(2400ms + var(--i)*110ms);
}
@keyframes snap{to{opacity:1;transform:none}}
@keyframes glow{0%,100%{fill-opacity:1}50%{fill-opacity:.6}}

/* ---------- nome ---------- */
.word{display:flex;font-size:clamp(38px,9vw,50px);font-weight:780;letter-spacing:-.02em;line-height:1}
.l{opacity:0;transform:translateY(10px)}
.go .l{animation:rise .5s ease-out forwards;animation-delay:calc(1300ms + var(--i)*70ms)}
@keyframes rise{to{opacity:1;transform:none}}

.tag{display:block;font-size:14px;color:var(--muted);opacity:0;text-align:center}
.go .tag{animation:rise .6s ease-out 1.9s forwards}

/* ---------- barra ---------- */
.bar{width:200px;height:3px;background:var(--track);border-radius:2px;overflow:hidden;opacity:0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));transform:scaleX(0);transform-origin:left}
.go .bar{animation:rise .3s 1.4s forwards}
.go .bar i{animation:fill 3.4s cubic-bezier(.5,0,.3,1) 1.5s forwards}
@keyframes fill{to{transform:scaleX(1)}}

@media (prefers-reduced-motion:reduce){
  .go .c{animation:snap .01ms forwards!important;animation-delay:0s!important}
  .go .tile{animation:pop .01ms forwards}
}
</style>
</head>
<body>
<div class="stage go" id="stage">
  <svg class="logo" viewBox="0 0 512 512" role="img" aria-label="Logo Taylor: um T formado por módulos alinhados">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#236bff"/><stop offset="1" stop-color="#3f35f5"/></linearGradient>
      <radialGradient id="gl" cx=".15" cy=".1" r=".8"><stop offset="0" stop-color="#4db5ff" stop-opacity=".55"/><stop offset="1" stop-color="#4db5ff" stop-opacity="0"/></radialGradient>
    </defs>
    <g class="tile">
      <rect width="512" height="512" rx="134" fill="url(#bg)"/>
      <rect width="512" height="512" rx="134" fill="url(#gl)"/>
      <rect x="1.5" y="1.5" width="509" height="509" rx="132.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
    </g>
    <rect class="c" style="--i:0;--x:-700px;--y:-520px;--r:-40deg" x="92"  y="122" width="56" height="56" rx="14" fill="#fff"/>
    <rect class="c" style="--i:1;--x:420px;--y:-700px;--r:25deg"  x="160" y="122" width="56" height="56" rx="14" fill="#fff"/>
    <rect class="c" style="--i:2;--x:-200px;--y:-800px;--r:60deg" x="228" y="122" width="56" height="56" rx="14" fill="#fff"/>
    <rect class="c" style="--i:3;--x:760px;--y:-400px;--r:-30deg" x="296" y="122" width="56" height="56" rx="14" fill="#fff"/>
    <rect class="c" style="--i:4;--x:900px;--y:-560px;--r:45deg"  x="364" y="122" width="56" height="56" rx="14" fill="#fff"/>
    <rect class="c" style="--i:5;--x:-620px;--y:520px;--r:-50deg" x="228" y="190" width="56" height="56" rx="14" fill="#dcecff"/>
    <rect class="c" style="--i:6;--x:300px;--y:760px;--r:35deg"   x="228" y="258" width="56" height="56" rx="14" fill="#b9deff"/>
    <rect class="c" style="--i:7;--x:-260px;--y:900px;--r:-20deg" x="228" y="326" width="56" height="56" rx="14" fill="#36db9b"/>
  </svg>

  <div class="word" aria-label="Taylor"><span class="l" style="--i:0">T</span><span class="l" style="--i:1">a</span><span class="l" style="--i:2">y</span><span class="l" style="--i:3">l</span><span class="l" style="--i:4">o</span><span class="l" style="--i:5">r</span></div>
  <p class="tag">Estamos carregando suas lojas. Aguarde...</p>
  <div class="bar" role="progressbar" aria-label="Carregando"><i></i></div>

</div>
<script>
var stage=document.getElementById('stage'),timer=null;
function play(){stage.classList.remove('go');void stage.offsetWidth;stage.classList.add('go');}
// modo: 'abertura' (uma vez, sem frase) ou 'carregamento' (repete, com frase)
window.setModo=function(m){
  var on=m==='carregamento';
  stage.classList.toggle('load',on);
  clearInterval(timer);
  if(on){play();timer=setInterval(play,7000);}
};
setModo(new URLSearchParams(location.search).get('modo')||'abertura');
</script>
</body>
</html>
