# Render Blueprint do back-end do Taylor (FastAPI + front estático).
#
# Só o back-end está aqui. O bot do Telegram (bot_estoque) já roda como outro serviço no
# Render; um Blueprint criaria uma segunda cópia com o mesmo token, e o Telegram entrega
# cada mensagem para uma cópia só. No serviço do bot, adicione DATABASE_URL, DB_SCHEMA=taylor
# e DB_POOL_MAX=3.
#
# Conexões com o banco (Session pooler do Supabase, cada conexão ocupa uma vaga do Pool Size):
#   WEB_CONCURRENCY x DB_POOL_MAX + DB_POOL_MAX do bot <= Pool Size (Supabase > Database >
#   Settings > Connection pooling). Com os valores abaixo: 2 x 5 + 3 = 13.
#
# No dia da palestra use um plano pago (o gratuito dorme sem uso e tem 0,1 CPU) e abra o
# site alguns minutos antes para aquecer. Passo a passo em COMO-RODAR.md.
services:
  - type: web
    name: taylor-api
    runtime: python
    region: virginia            # mais perto do Supabase (aws-0-us-east-1)
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    # O uvicorn usa WEB_CONCURRENCY como número de workers. Keep-alive maior que o do proxy do
    # Render evita conexões fechadas no meio de uma requisição.
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL       # Supabase > Connect > Session pooler (porta 5432)
        sync: false
      - key: DB_SCHEMA
        value: taylor
      - key: JWT_SECRET         # o mesmo em todos os workers; gerado uma vez pelo Render
        generateValue: true
      - key: DEMO_MODE          # false: sem token não há acesso e o link de "esqueci a senha" não aparece na tela
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_MAX
        value: "5"
      - key: CONTA_DEMO_HORAS
        value: "6"
      - key: CONTA_DEMO_MAX
        value: "200"
      - key: GEMINI_API_KEY     # opcional: sem chave o assistente usa palavras-chave
        sync: false
